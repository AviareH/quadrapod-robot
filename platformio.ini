[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
lib_deps = 
	madhephaestus/ESP32Servo@^3.2.0
	adafruit/Adafruit PWM Servo Driver Library@^3.0.3

[platformio]
